name: Build & Deploy Felipe

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/thiago-souza-ads

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Auth
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/felipe-auth:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Users
        uses: docker/build-push-action@v5
        with:
          context: ./services/users
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/felipe-users:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docs
        uses: docker/build-push-action@v5
        with:
          context: ./services/docs
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/felipe-docs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/felipe-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/stacks/felipe && cd /opt/stacks/felipe

            cat > .env <<'ENVEOF'
POSTGRES_PASSWORD=REPLACE_POSTGRES
JWT_SECRET=REPLACE_JWT
ANTHROPIC_API_KEY=REPLACE_ANTHROPIC
MINIO_ACCESS_KEY=REPLACE_MINIO_KEY
MINIO_SECRET_KEY=REPLACE_MINIO_SECRET
REGISTRY=ghcr.io
ENVEOF
            sed -i "s|REPLACE_POSTGRES|${{ secrets.POSTGRES_PASSWORD }}|g" .env
            sed -i "s|REPLACE_JWT|${{ secrets.JWT_SECRET }}|g" .env
            sed -i "s|REPLACE_ANTHROPIC|${{ secrets.ANTHROPIC_API_KEY }}|g" .env
            sed -i "s|REPLACE_MINIO_KEY|${{ secrets.MINIO_ACCESS_KEY }}|g" .env
            sed -i "s|REPLACE_MINIO_SECRET|${{ secrets.MINIO_SECRET_KEY }}|g" .env

            curl -sH "Authorization: token ${{ secrets.GH_TOKEN }}" \
              -H "Accept: application/vnd.github.v3.raw" \
              -o stack.yml \
              "https://api.github.com/repos/thiago-souza-ads/felipe/contents/infrastructure/stack.yml"

            curl -sH "Authorization: token ${{ secrets.GH_TOKEN }}" \
              -H "Accept: application/vnd.github.v3.raw" \
              -o postgres-init.sh \
              "https://api.github.com/repos/thiago-souza-ads/felipe/contents/infrastructure/postgres-init.sh"

            chmod +x postgres-init.sh

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/thiago-souza-ads/felipe-auth:latest
            docker pull ghcr.io/thiago-souza-ads/felipe-users:latest
            docker pull ghcr.io/thiago-souza-ads/felipe-docs:latest
            docker pull ghcr.io/thiago-souza-ads/felipe-frontend:latest

            export $(cat .env | xargs) && docker stack deploy -c stack.yml --with-registry-auth felipe
            echo "Deploy concluido!"
