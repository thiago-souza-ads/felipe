name: Build & Deploy Felipe

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/thiago-souza-ads

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Auth
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/felipe-auth:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Users
        uses: docker/build-push-action@v5
        with:
          context: ./services/users
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/felipe-users:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docs
        uses: docker/build-push-action@v5
        with:
          context: ./services/docs
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/felipe-docs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/felipe-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      GH_DEPLOY_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_ACTOR: ${{ github.actor }}
      GH_TOKEN_REGISTRY: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: POSTGRES_PASSWORD,JWT_SECRET,ANTHROPIC_API_KEY,MINIO_ACCESS_KEY,MINIO_SECRET_KEY,GH_DEPLOY_TOKEN,GH_ACTOR,GH_TOKEN_REGISTRY
          script: |
            mkdir -p /opt/stacks/felipe
            cd /opt/stacks/felipe

            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" > .env
            echo "JWT_SECRET=${JWT_SECRET}" >> .env
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" >> .env
            echo "MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}" >> .env
            echo "MINIO_SECRET_KEY=${MINIO_SECRET_KEY}" >> .env
            echo "REGISTRY=ghcr.io" >> .env

            curl -sfH "Authorization: token ${GH_DEPLOY_TOKEN}" \
              -H "Accept: application/vnd.github.v3.raw" \
              -o stack.yml \
              "https://api.github.com/repos/thiago-souza-ads/felipe/contents/infrastructure/stack.yml"

            curl -sfH "Authorization: token ${GH_DEPLOY_TOKEN}" \
              -H "Accept: application/vnd.github.v3.raw" \
              -o postgres-init.sh \
              "https://api.github.com/repos/thiago-souza-ads/felipe/contents/infrastructure/postgres-init.sh"
            chmod +x postgres-init.sh

            echo "${GH_TOKEN_REGISTRY}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            docker pull ghcr.io/thiago-souza-ads/felipe-auth:latest
            docker pull ghcr.io/thiago-souza-ads/felipe-users:latest
            docker pull ghcr.io/thiago-souza-ads/felipe-docs:latest
            docker pull ghcr.io/thiago-souza-ads/felipe-frontend:latest

            set -a && source .env && set +a
            docker stack deploy -c stack.yml --with-registry-auth felipe
            echo "Deploy concluido!"
